openapi: 3.1.0
info:
  title: TM Webhooks Diagnostics Receiver
  version: 1.3.0
  description: >-
    Local, unauthenticated receiver for run recordings streamed by the TM Webhooks
    diagnostics build in Trackmania Turbo and Trackmania Next. Independent of the
    race webhook contract in the repository root openapi.yaml. See
    docs/diagnostics-harness.md.
servers:
  - url: http://127.0.0.1:8787
    description: Default local diagnostics receiver.
security: []
paths:
  /health:
    get:
      operationId: getDiagnosticsHealth
      summary: Receiver health and supported packet schema versions
      responses:
        '200':
          description: Receiver is running.
          content:
            application/json:
              schema:
                type: object
                required: [status, schemaVersions]
                properties:
                  status:
                    type: string
                    const: ok
                  schemaVersions:
                    type: array
                    items:
                      type: string
        '404':
          description: Unknown path.
  /diagnostics/v1/chunks:
    post:
      operationId: receiveDiagnosticsPacket
      summary: Receive a diagnostics run recorder stream packet
      description: >-
        Separate, unauthenticated local diagnostics receiver, not the race webhook
        service. Each packet carries one record (maximum 32 KiB, 32768 packets)
        without a total; the final manifest index defines the total. Captures are
        capped at 32 MiB including metadata reserve. Out-of-order packets and
        identical duplicates are accepted; gaps or a lost manifest remain
        incomplete. Senders do not wait for acknowledgements or retry failures.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticsStreamPacket'
      responses:
        '200':
          description: Identical packet already stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsAck'
        '201':
          description: Packet stored; complete is true only when all packets exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsAck'
        '400':
          description: Invalid JSON or packet contract.
        '409':
          description: Conflicting packet content, game, or final index for this capture ID.
        '413':
          description: Packet or capture exceeds size limits.
        '415':
          description: Content type must be application/json.
        '503':
          description: Temporary storage failure. The sender drops the packet.
        '507':
          description: Receiver storage quota exhausted; free space or let retention expire.
components:
  schemas:
    DiagnosticsStreamPacket:
      type: object
      required: [schemaVersion, captureId, game, index, kind, data]
      not:
        properties:
          total: {}
        required: [total]
      properties:
        schemaVersion:
          type: string
          const: 1.1.0
        captureId:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        game:
          type: string
          enum: [turbo, next]
        index:
          type: integer
          minimum: 0
          maximum: 32767
          description: Increasing attempted-record index; the final manifest's index defines the last index.
        kind:
          type: string
          enum: [record, manifest]
        data:
          type: object
          additionalProperties: true
          allOf:
            - if:
                required: [kind]
                properties:
                  kind:
                    const: run-sample
              then:
                $ref: '#/components/schemas/DiagnosticsRunSample'
      allOf:
        - if:
            properties:
              kind:
                const: record
          then:
            properties:
              index:
                maximum: 32766
        - if:
            properties:
              kind:
                const: manifest
          then:
            properties:
              data:
                $ref: '#/components/schemas/DiagnosticsManifest'
    DiagnosticsRunSample:
      type: object
      additionalProperties: true
      required:
        [
          kind,
          recordingId,
          recordSequence,
          elapsedMs,
          observedAt,
          playerId,
          playerIndex,
          sampleSequence,
          mapUid,
          apiType,
          race,
          sources,
        ]
      properties:
        kind:
          type: string
          const: run-sample
        recordingId:
          type: string
          format: uuid
          description: Stable capture ID from recording start until disabled or a segment limit.
        recordSequence:
          type: integer
          minimum: 0
          description: Matches the attempted stream packet index, including gaps for drops.
        elapsedMs:
          type: integer
          minimum: 0
          description: Observed monotonic milliseconds since recording start.
        observedAt:
          type: string
        sampleSequence:
          type: integer
          minimum: 1
        playerId:
          type: string
          description: Recording-local identity from game user identity and roster slot.
        playerIndex:
          type: integer
          minimum: 0
        userKey:
          type: string
          description: Source user identity; can be shared by split-screen participants.
        name:
          type: string
          description: Display name, intentionally included with the user's requested player details.
        mapUid:
          type: string
        attemptToken:
          type: string
          description: Source start token and map; changes are evidence to inspect, not proof of a restart.
        apiType:
          type: string
        race:
          type: object
          additionalProperties: true
          description: Race clock, state, checkpoint history, laps, respawns and finish where exposed. Missing fields remain absent.
        input:
          type: object
          additionalProperties: true
          description: Throttle, braking and steering, where exposed.
        vehicle:
          type: object
          additionalProperties: true
          description: Native speed, display speed, position, velocity, gears, RPM, contacts, skidding and damage where exposed. No unverified unit conversion.
        sources:
          type: object
          additionalProperties:
            type: string
          description: Per-sample source overrides. Recording-start sources supply default field-to-API mappings.
    DiagnosticsManifest:
      type: object
      additionalProperties: true
      required: [startedAt, endedAt, status]
      properties:
        startedAt:
          type: string
        endedAt:
          type: string
        status:
          type: string
          enum: [complete, truncated, cancelled, failed]
        captureMode:
          type: string
          const: run-recorder
        collectorVersion:
          type: string
        reason:
          type: string
          description: Why the recording ended, such as disabled, duration-limit, packet-limit or byte-limit.
        attemptedRecords:
          type: integer
          minimum: 0
        locallyDroppedRecords:
          type: integer
          minimum: 0
        sampleCount:
          type: integer
          minimum: 0
        durationMs:
          type: integer
          minimum: 0
    DiagnosticsAck:
      type: object
      required: [captureId, index, complete, missing]
      properties:
        captureId:
          type: string
          format: uuid
        index:
          type: integer
          minimum: 0
        complete:
          type: boolean
        missing:
          type: [array, 'null']
          description: Null until the streaming manifest supplies the final index.
          items:
            type: integer
            minimum: 0
