name: PR Diagnostics Harness
on:
  pull_request:
permissions:
  contents: read
jobs:
  diagnostics:
    name: Validate diagnostics receiver and production isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Diagnostics receiver OpenAPI
        run: npx --yes @redocly/cli lint tools/diagnostics-receiver/openapi.yaml
      - name: Receiver protocol, HTTP ingestion and timeline reconstruction
        run: bun test tests/diagnostics-receiver.test.mjs tests/diagnostics-timeline.test.mjs
      - name: Recorder API fields and production package isolation
        run: python3 tests/diagnostics-recorder.py
